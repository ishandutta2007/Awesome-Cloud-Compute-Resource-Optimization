<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes wave {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }

    .animated-bg-circle { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .floating-card { animation: float 4s ease-in-out infinite; }
    .wave-line { stroke-dasharray: 10, 10; animation: wave 10s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Animated Background Elements -->
  <circle cx="150" cy="80" r="180" fill="#6366f1" opacity="0.15" class="animated-bg-circle"/>
  <circle cx="1050" cy="240" r="220" fill="#ec4899" opacity="0.12" class="animated-bg-circle" style="animation-delay: -3s;"/>
  
  <!-- Subtle Wave Lines (Background Layer) -->
  <path d="M 0,220 Q 300,160 600,240 T 1200,180" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3" class="wave-line"/>
  <path d="M 0,260 Q 400,200 800,280 T 1200,220" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" class="wave-line" style="animation-delay: -5s;"/>

  <!-- Decorative Right Side Graphic Elements (Non-overlapping with Title) -->
  <g transform="translate(860, 40)" class="floating-card">
    <rect width="280" height="240" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="38" font-family="sans-serif" font-weight="700" font-size="14" fill="#f8fafc">💡 Compute Efficiency</text>
    
    <!-- Mini Simulated Graph -->
    <path d="M 20,180 L 70,160 L 120,170 L 170,110 L 220,130 L 260,70" fill="none" stroke="#22c55e" stroke-width="3" filter="url(#glow)"/>
    <path d="M 20,180 L 70,160 L 120,170 L 170,110 L 220,130 L 260,70 L 260,200 L 20,200 Z" fill="#22c55e" opacity="0.1"/>
    
    <line x1="20" y1="200" x2="260" y2="200" stroke="#475569" stroke-width="1"/>
    
    <!-- Stat Badges -->
    <rect x="20" y="55" width="115" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="30" y="72" font-family="sans-serif" font-size="10" fill="#94a3b8">Cloud Waste</text>
    <text x="30" y="85" font-family="sans-serif" font-weight="700" font-size="12" fill="#ef4444">-45% Reduced</text>

    <rect x="145" y="55" width="115" height="36" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="155" y="72" font-family="sans-serif" font-size="10" fill="#94a3b8">Autoscaling</text>
    <text x="155" y="85" font-family="sans-serif" font-weight="700" font-size="12" fill="#38bdf8">KEDA / VPA</text>
  </g>

  <!-- Foreground Title and Subtitle (Guaranteed Clear Visibility) -->
  <g transform="translate(60, 0)">
    <!-- Pill Badge -->
    <rect x="0" y="55" width="280" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="16" y="76" class="badge-text">⚡ CLOUD COMPUTE &amp; FINOPS</text>

    <!-- Main Title -->
    <text x="0" y="140" class="title">Awesome Cloud Compute</text>
    <text x="0" y="190" class="title" fill="url(#accentGrad)">Resource Optimization ⚙️</text>

    <!-- Subtitle -->
    <text x="0" y="235" class="subtitle">Curated directory of FinOps platforms, Kubernetes autoscalers &amp; VM rightsizing engines.</text>

    <!-- Category Tags -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#334155" opacity="0.6"/>
      <text x="12" y="17" font-family="sans-serif" font-size="12" fill="#cbd5e1">#Kubernetes</text>

      <rect x="120" y="0" width="90" height="26" rx="6" fill="#334155" opacity="0.6"/>
      <text x="132" y="17" font-family="sans-serif" font-size="12" fill="#cbd5e1">#Rightsizing</text>

      <rect x="220" y="0" width="80" height="26" rx="6" fill="#334155" opacity="0.6"/>
      <text x="232" y="17" font-family="sans-serif" font-size="12" fill="#cbd5e1">#FinOps</text>
      
      <rect x="310" y="0" width="100" height="26" rx="6" fill="#334155" opacity="0.6"/>
      <text x="322" y="17" font-family="sans-serif" font-size="12" fill="#cbd5e1">#Autoscaling</text>
    </g>
  </g>
</svg>
